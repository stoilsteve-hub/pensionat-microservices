apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-db-deployment
  labels:
    app: booking-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-db
  template:
    metadata:
      labels:
        app: booking-db
    spec:
      containers:
        - name: booking-db
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: bookify
            - name: MYSQL_ROOT_PASSWORD
              value: root